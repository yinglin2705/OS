name: Read-only calendar diagnosis
on:
  push:
    branches: [main]
    paths:
      - scripts/diagnose-calendar.mjs
      - .github/workflows/calendar-diagnostics.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify owner-visible counts without reading calendar contents into logs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/diagnose-calendar.mjs
