name: Deploy simple calendar and confirm existing schedule
on:
  push:
    branches: [main]
    paths:
      - supabase/migrations/009_simple_calendar.sql
      - scripts/deploy-simple-calendar.mjs
      - .github/workflows/deploy-simple-calendar.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ying-os-simple-calendar-schema
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy calendar controls and execute authorized one-time confirmation
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/deploy-simple-calendar.mjs
