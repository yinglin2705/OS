name: Deploy Career Agent schema
on:
  push:
    branches: [main]
    paths:
      - supabase/migrations/007_career_agent.sql
      - supabase/migrations/010_career_hardening.sql
      - scripts/deploy-career.mjs
      - .github/workflows/deploy-career.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ying-os-career-schema
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply isolated additive career migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/deploy-career.mjs
