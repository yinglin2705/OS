name: Deploy event status controls
on:
  push:
    branches: [main]
    paths:
      - supabase/migrations/008_event_status.sql
      - scripts/deploy-event-status.mjs
      - .github/workflows/deploy-event-status.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ying-os-event-status-schema
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add owner-only status RPC
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/deploy-event-status.mjs
